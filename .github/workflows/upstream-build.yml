name: Upstream sync and APK build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream termux-app ref to build'
        required: true
        default: 'v0.119.0-beta.3'
      package_variant:
        description: 'Termux package variant'
        required: true
        default: 'apt-android-7'
        type: choice
        options:
          - apt-android-7
          - apt-android-5
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_variant:
          - apt-android-7
          - apt-android-5

    steps:
      - name: Checkout Termux-bai
        uses: actions/checkout@v4

      - name: Checkout official termux-app
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: ${{ inputs.ref || 'v0.119.0-beta.3' }}
          path: upstream/termux-app
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-30' \
            'build-tools;30.0.3' \
            'ndk;22.1.7171670'

      - name: Configure Gradle caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build official baseline APK
        working-directory: upstream/termux-app
        env:
          TERMUX_PACKAGE_VARIANT: ${{ matrix.package_variant }}
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK outputs
        working-directory: upstream/termux-app
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload baseline APKs
        uses: actions/upload-artifact@v4
        with:
          name: termux-bai-baseline-${{ matrix.package_variant }}
          path: upstream/termux-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
