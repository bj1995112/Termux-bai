name: Upstream Sync & Build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Termux-bai
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream termux-app
        run: |
          git remote add upstream https://github.com/termux/termux-app.git || true
          git fetch upstream --tags --prune
          echo "Latest upstream tag: $(git tag --sort=-version:refname | head -n 1)"

      - name: Verify configured baseline
        run: |
          echo "Configured upstream baseline: v0.119.0-beta.3"
          git ls-remote --tags https://github.com/termux/termux-app.git refs/tags/v0.119.0-beta.3

      - name: Build gate
        run: |
          echo "Build gate placeholder: official source synchronization is verified."
          echo "Full APK build will be enabled after the upstream source is integrated."
